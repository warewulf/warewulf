---
name: release

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild and republish the nightly even if it is already current'
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'
  schedule:
    - cron: '05 00 * * *'

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref || 'nightly' }}
  cancel-in-progress: false

jobs:
  dist:
    name: Build warewulf.spec and source dist
    runs-on: ubuntu-latest
    outputs:
      needs-build: ${{ steps.commits.outputs.needs-build }}
      commits: ${{ steps.commits.outputs.commits }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether the nightly release is current
        if: github.event_name != 'push'
        id: commits
        shell: bash
        run: |
          head=$(git rev-parse HEAD)
          if last=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}') \
             && git merge-base --is-ancestor "${last}" "${head}"
          then
            range="${last}..${head}"
          else
            echo "No usable nightly tag"
            range=""
          fi

          if [ -n "${range}" ] && [ "${last}" = "${head}" ]; then
            echo "needs-build=false" >>$GITHUB_OUTPUT
            echo "Nightly release is already current at ${head}"
          else
            echo "needs-build=true" >>$GITHUB_OUTPUT
          fi

          if [ -n "${range}" ]; then
            log=$(git log --oneline "${range}")
          else
            echo "No range specified, using last 20 commits"
            log=$(git log --oneline -n 20 "${head}")
          fi
          echo "commits=$(printf '%s' "${log}" | base64 --wrap=0)" >>$GITHUB_OUTPUT

      - name: Build spec and dist
        run: |
          make warewulf.spec dist

      - name: Get build version
        id: version
        run: |
          VERSION=$(make version)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Upload spec
        uses: actions/upload-artifact@v4
        with:
          name: warewulf-spec
          retention-days: 7
          path: |
            warewulf.spec

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: warewulf-dist
          retention-days: 7
          path: |
            warewulf-*.tar.gz

  rpms:
    needs: dist
    if: >-
      github.event_name == 'push'
      || inputs.force
      || needs.dist.outputs.needs-build == 'true'
    name: Build RPMs
    runs-on: ${{ matrix.runs-on }}
    container:
      image: rockylinux/rockylinux:10
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        dist: [el10, el9, el8, suse.lp156]
        include:
          - dist: el8
            target: rocky+epel-8
          - dist: el9
            target: rocky+epel-9
          - dist: el10
            target: rocky+epel-10
          - dist: suse.lp156
            target: opensuse-leap-15.6
          - arch: x86_64
            runs-on: ubuntu-24.04
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    steps:
      - name: Prepare mock
        run: |
          dnf -y install epel-release
          dnf -y install rpm-build mock
          usermod -a -G mock $(whoami)
          echo "config_opts['print_main_output'] = True" >>/etc/mock/site-defaults.cfg

      - name: Download spec
        uses: actions/download-artifact@v4
        with:
          name: warewulf-spec

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: warewulf-dist

      - name: Build RPMs and run tests
        run: |
          root="${{ matrix.target }}-${{ matrix.arch }}"
          eol_root="/etc/mock/eol/${root}.cfg"
          if [ -f "${eol_root}" ]
          then
            root="${eol_root}"
          fi
          mock --root="${root}" --rebuild --spec=warewulf.spec --sources=. \
          && mock --root="${root}" --chroot -- bash -c "make -C /builddir/build/BUILD/warewulf-${{ needs.dist.outputs.version }} test"

      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: warewulf-rpms-${{ matrix.target }}-${{ matrix.arch }}
          retention-days: 7
          path: |
            /var/lib/mock/${{ matrix.target }}-${{ matrix.arch }}/result/warewulf-*.rpm

  release:
    needs: [dist, rpms]
    if: >-
      github.event_name == 'push'
      || inputs.force
      || needs.dist.outputs.needs-build == 'true'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The nightly release tracks the default branch only: a workflow_dispatch
      # from any other ref builds RPMs but must not move the nightly tag.
      IS_NIGHTLY: >-
        ${{ github.event_name != 'push'
            && github.ref_name == github.event.repository.default_branch }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Verify artifacts
        run: |
          # Fail here, before the next step deletes the current nightly release
          # and its tag. Without this an empty download would destroy the good
          # nightly and only be caught by the create step afterwards, leaving no
          # release at all. Unmatched globs make ls exit non-zero.
          ls -l artifacts/*.tar.gz artifacts/*.rpm

      - name: Skip nightly release (not the default branch)
        if: github.event_name != 'push' && env.IS_NIGHTLY != 'true'
        run: |
          echo "::notice::Built RPMs from ${{ github.ref_name }} but did not publish:" \
               "the nightly release only tracks ${{ github.event.repository.default_branch }}."

      - name: Delete previous release (nightly)
        if: env.IS_NIGHTLY == 'true'
        run: |
          gh release delete "nightly" \
            --repo ${{ github.repository }} \
            --cleanup-tag --yes \
          || echo "No previous nightly release found"

      - name: Create release (tagged)
        if: github.event_name == 'push'
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/*.tar.gz \
            artifacts/*.rpm \
            --repo ${{ github.repository }} \
            --title "${{ github.ref_name }}" \
            --draft

      - name: Create release (nightly)
        if: env.IS_NIGHTLY == 'true'
        run: |
          COMMITS=$(echo "${{ needs.dist.outputs.commits }}" | base64 --decode)
          gh release create "nightly" \
            artifacts/*.tar.gz \
            artifacts/*.rpm \
            --repo ${{ github.repository }} \
            --target "${{ github.sha }}" \
            --title "nightly" \
            --prerelease \
            --notes "NIGHTLY RELEASE

          Commits for the nightly release:

          ${COMMITS}"
